[package]
name = "bilibili_cli"
version = "1.0.0"
edition = "2024"
publish = false
description = "Front door for `bilibili_cli`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "bcli"
path = "src/main.rs"

[dependencies]
clap = "4"
parse-rs = { path = "../parse" }
play-rs = { path = "../play" }
proto-rs = { path = "../proto" }
serde_json = { version = "1", features = ["preserve_order"] }
sign-rs = { path = "../sign" }

[workspace]
