[package]
name = "proto-rs"
version = "1.0.0"
edition = "2024"
publish = false
description = "bilibili_cli 单元库（lift 后）"

[lib]
name = "proto"
crate-type = ["rlib"]

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
